<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Fatih — yazılım geliştirici</title>
  <desc id="description">Yazılım geliştirme, siber güvenlik ve sistemler</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#080D17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6672"/>
      <stop offset="1" stop-color="#D7263D"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="20" fill="url(#background)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <circle cx="1060" cy="170" r="205" fill="#D7263D" opacity=".06"/>
  <path d="M0 0h8v340H0z" fill="url(#accent)"/>
  <path d="M84 101h42" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

  <text x="84" y="178" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="1">FATİH</text>
  <text x="87" y="222" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="3">YAZILIM GELİŞTİRME</text>
  <text x="87" y="256" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="1.2">SİBER GÜVENLİK  ·  SİSTEMLER  ·  ÜRETİM</text>

  <g transform="translate(945 170)">
    <circle r="84" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1"/>
    <circle r="62" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="1"/>
    <circle r="42" fill="#D7263D" opacity=".14"/>
    <path d="M15-31a38 38 0 1 0 0 62 31 31 0 1 1 0-62Z" fill="url(#accent)"/>
    <path d="m44-20 4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1Z" fill="#F8FAFC"/>
    <circle cx="-57" cy="45" r="3" fill="#FF6672"/>
    <circle cx="57" cy="-47" r="2" fill="#FF6672" opacity=".7"/>
  </g>

  <path d="M84 294h1032" stroke="#FFFFFF" stroke-opacity=".1"/>
  <text x="84" y="319" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1.5">MERAK ET  /  ÖĞREN  /  İNŞA ET</text>
</svg>
